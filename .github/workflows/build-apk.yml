name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Setup Android SDK 36 & Environment
        run: |
          touch .env
          touch .env.example
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

          # Accept SDK licenses & install API 36 tools directly via runner cmdline-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace -Pandroid.builder.sdkDownload=true
          else
            gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace -Pandroid.builder.sdkDownload=true
          fi

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find . -name "*.apk" -type f -exec cp -v {} artifacts/ \;
          echo "Found APK files:"
          ls -la artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cake-lovers-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
